set -g status-position top
set -g status-interval 2
set -g status-style 'bg=#1e1e2e,fg=#cdd6f4'
set -g status-left-length 40
set -g status-right-length 120
set -g status-left '#[bold,fg=#11111b,bg=#89b4fa] #S #[default] '
set -g window-status-format '#[fg=#6c7086] #I:#W '
set -g window-status-current-format '#[bold,fg=#11111b,bg=#cba6f7] #I:#W #[default]'
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#89b4fa'
set -g message-style 'bg=#313244,fg=#cdd6f4'

# Hooks write these window-local options. There are no status-line subprocesses.
set -g status-right '#[fg=#89b4fa]#{@agent_provider} #[fg=#a6e3a1]#{?#{==:#{@agent_state},working},● ,}#[fg=#f9e2af]#{?#{==:#{@agent_state},waiting},▲ ,}#[fg=#94e2d5]#{?#{==:#{@agent_state},done},✓ ,}#[fg=#cba6f7]#{?#{>:#{@agent_subagents},0},⑂#{@agent_subagents} ,}#[fg=#cdd6f4]%Y-%m-%d %H:%M '
