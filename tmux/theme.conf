# Moonlight II palette, matching the personal cockpit without a theme daemon.
set -g @thm_background "#222436"
set -g @thm_foreground "#c8d3f5"
set -g @thm_accent "#82aaff"
set -g @thm_bg_dark "#1e2030"
set -g @thm_bg_highlight "#2f334d"
set -g @thm_fg_gutter "#3b4261"
set -g @thm_comment "#636da6"
set -g @thm_selection_background "#2d3f76"
set -g @thm_color2 "#c3e88d"
set -g @thm_color3 "#ffc777"

set -g status-style             "bg=#{@thm_bg_dark},fg=#{@thm_foreground}"
set -g pane-border-style        "fg=#{@thm_fg_gutter}"
set -g pane-active-border-style "fg=#{@thm_accent}"
set -g message-style            "bg=#{@thm_bg_highlight},fg=#{@thm_foreground}"
set -g mode-style               "bg=#{@thm_selection_background},fg=#{@thm_foreground}"

set -g status on
set -g status-position top
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 110
set -g status-left "#[fg=#{@thm_bg_dark},bg=#{@thm_accent},bold] #S #[fg=#{@thm_accent},bg=#{@thm_bg_dark},nobold] "

# Lifecycle hooks set these window-local options; agent state itself is never polled.
set -g @_agent "#{?#{==:#{@agent_state},working},#[fg=#{@thm_accent}]● ,#{?#{==:#{@agent_state},waiting},#[fg=#{@thm_color3}]▲ ,#{?#{==:#{@agent_state},done},#[fg=#{@thm_color2}]✓ ,}}}"
set -g @_subs "#{?#{&&:#{!=:#{@agent_subagents},},#{!=:#{@agent_subagents},0}},#[fg=#{@thm_comment}]⑂#{@agent_subagents} ,}"

set -g window-status-format "#[fg=#{@thm_comment}] #I #{E:@_agent}#{E:@_subs}#[fg=#{@thm_comment}]#W#{?window_zoomed_flag, ,} "
set -g window-status-current-format "#[fg=#{@thm_accent},bold] #I #{E:@_agent}#{E:@_subs}#[fg=#{@thm_foreground},bold]#W#{?window_zoomed_flag, ,} "
set -g window-status-activity-style "fg=#{@thm_color3}"
set -g window-status-bell-style "fg=#{@thm_color3},bold"
set -g window-status-separator ""

set -g status-right "#[fg=#{@thm_accent},bold]#{@agent_provider} #[fg=#{@thm_comment},nobold]#(~/.config/tmux/scripts/git-status '#{pane_current_path}')#[fg=#{@thm_comment}] %H:%M "
