# tmux — the agent cockpit. Windows are projects; their tabs show agent state.

##### Ghostty terminal capabilities #############################
set  -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-ghostty:RGB'
set -as terminal-features ',xterm-ghostty:hyperlinks'
set -as terminal-features ',xterm-ghostty:overline'
set -as terminal-features ',xterm-ghostty:extkeys'
set  -g extended-keys always
set  -g extended-keys-format csi-u
set -as terminal-overrides ',xterm*:sitm=\E[3m'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -ga update-environment "COLORTERM"
set  -g allow-passthrough on

##### General ###################################################
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set  -g mouse on
set  -g set-clipboard on
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on
set  -g history-limit 100000
set  -g escape-time 0
set  -g focus-events on
set  -g status-interval 5
setw -g aggressive-resize on
setw -g automatic-rename on
setw -g automatic-rename-format "#(~/.config/tmux/scripts/window-name '#{pane_current_command}' '#{pane_current_path}' '#{pane_tty}')"
set  -g display-time 2000

setw -g monitor-activity on
set  -g visual-activity off
set  -g visual-bell off
set  -g bell-action other

##### Keys ######################################################
unbind c
bind c new-window      -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind = select-layout tiled

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"
bind y setw synchronize-panes \; display "sync #{?pane_synchronized,on,off}"
bind -r ( switch-client -p
bind -r ) switch-client -n

##### Theme and status ##########################################
source-file ~/.config/tmux/theme.conf
